<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080b12" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <linearGradient id="cyber-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="crimson-flame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0844" />
      <stop offset="100%" stop-color="#ffb199" />
    </linearGradient>

    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="purple-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="badge-shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(15px, -10px); opacity: 0.6; }
    }
    @keyframes pulseRedOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.3; }
      50% { transform: scale(1.2) translate(-20px, 15px); opacity: 0.55; }
    }
    @keyframes radarScan {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -100; }
    }
    @keyframes pillFloat1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes pillFloat2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    @keyframes waveBeam {
      0% { stroke-dashoffset: 400; opacity: 0.2; }
      50% { opacity: 0.8; }
      100% { stroke-dashoffset: 0; opacity: 0.2; }
    }

    .orb-cyan { animation: pulseOrb 8s ease-in-out infinite alternate; transform-origin: 200px 100px; }
    .orb-red { animation: pulseRedOrb 9s ease-in-out infinite alternate; transform-origin: 1000px 300px; }
    .radar-beam { animation: radarScan 10s linear infinite; transform-origin: 1040px 180px; }
    .data-flow { stroke-dasharray: 8, 8; animation: dashMove 4s linear infinite; }
    .floating-pill-1 { animation: pillFloat1 5s ease-in-out infinite; }
    .floating-pill-2 { animation: pillFloat2 6s ease-in-out infinite; }
    .circuit-wave { stroke-dasharray: 200, 200; animation: waveBeam 6s ease-in-out infinite; }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="orb-cyan" cx="180" cy="120" r="160" fill="#0284c7" filter="url(#glow-cyan)" opacity="0.35" />
  <circle class="orb-red" cx="1020" cy="280" r="180" fill="#be123c" filter="url(#glow-red)" opacity="0.25" />
  <circle cx="600" cy="380" r="140" fill="#6366f1" filter="url(#glow-cyan)" opacity="0.15" />

  <!-- Animated Circuit Flows in Background -->
  <path class="circuit-wave" d="M -50 210 Q 300 80, 600 210 T 1250 210" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3" />
  <path class="data-flow" d="M 50 350 L 300 350 L 380 290 L 820 290 L 900 350 L 1150 350" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.4" />
  <path class="data-flow" d="M 100 80 L 400 80 L 470 140 L 730 140 L 800 80 L 1100 80" fill="none" stroke="#f43f5e" stroke-width="1.5" opacity="0.35" />

  <!-- Radar HUD in Background -->
  <g opacity="0.25">
    <circle cx="1040" cy="180" r="110" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4" />
    <circle cx="1040" cy="180" r="75" fill="none" stroke="#38bdf8" stroke-width="1" />
    <circle cx="1040" cy="180" r="40" fill="none" stroke="#38bdf8" stroke-width="1" />
    <line x1="930" y1="180" x2="1150" y2="180" stroke="#38bdf8" stroke-width="1" />
    <line x1="1040" y1="70" x2="1040" y2="290" stroke="#38bdf8" stroke-width="1" />
    <g class="radar-beam">
      <path d="M 1040 180 L 1140 140 A 110 110 0 0 0 1040 70 Z" fill="url(#cyber-cyan)" opacity="0.4" />
    </g>
  </g>

  <!-- Left Cyber Shield Graphic -->
  <g transform="translate(70, 75)" opacity="0.9">
    <polygon points="50,10 90,25 90,75 50,105 10,75 10,25" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" filter="url(#badge-shadow)"/>
    <path d="M 50 25 L 75 37 L 75 70 L 50 88 L 25 70 L 25 37 Z" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="4,2"/>
    <circle cx="50" cy="55" r="10" fill="url(#crimson-flame)"/>
    <!-- Crosshair lines -->
    <line x1="50" y1="35" x2="50" y2="45" stroke="#fff" stroke-width="2"/>
    <line x1="50" y1="65" x2="50" y2="75" stroke="#fff" stroke-width="2"/>
    <line x1="30" y1="55" x2="40" y2="55" stroke="#fff" stroke-width="2"/>
    <line x1="60" y1="55" x2="70" y2="55" stroke="#fff" stroke-width="2"/>
  </g>

  <!-- FOREGROUND: Main Title and Headings -->
  <g id="foreground-content">
    <!-- Super-heading Tag -->
    <g transform="translate(195, 75)">
      <rect width="320" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" opacity="0.95" />
      <circle cx="16" cy="14" r="5" fill="#10b981">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="19" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">AUTONOMOUS SECURITY ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="195" y="145" fill="url(#text-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.8">
      Autonomous Penetration Testing
    </text>
    <text x="195" y="195" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      &amp; Modern AppSec Matrix
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="195" y="235" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500">
      Curated index of AI Security Agents, Continuous PTaaS, Dynamic DAST/SAST &amp; Breach and Attack Simulation
    </text>

    <!-- Interactive Badges / Capability Pills (Foreground, Bottom-Aligned) -->
    <g class="floating-pill-1" transform="translate(195, 275)" filter="url(#badge-shadow)">
      <rect width="180" height="42" rx="21" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="24" cy="21" r="7" fill="#0284c7" />
      <text x="40" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">🤖 AI Pentest Agents</text>
    </g>

    <g class="floating-pill-2" transform="translate(390, 275)" filter="url(#badge-shadow)">
      <rect width="195" height="42" rx="21" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" />
      <circle cx="24" cy="21" r="7" fill="#e11d48" />
      <text x="40" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">⚔️ Breach Simulation</text>
    </g>

    <g class="floating-pill-1" transform="translate(600, 275)" filter="url(#badge-shadow)">
      <rect width="190" height="42" rx="21" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" />
      <circle cx="24" cy="21" r="7" fill="#9333ea" />
      <text x="40" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">🛡️ Continuous DAST</text>
    </g>

    <g class="floating-pill-2" transform="translate(805, 275)" filter="url(#badge-shadow)">
      <rect width="180" height="42" rx="21" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
      <circle cx="24" cy="21" r="7" fill="#059669" />
      <text x="40" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">🔍 Real-time Exploit</text>
    </g>

    <!-- Footer Meta Stats Line -->
    <g transform="translate(195, 360)">
      <text x="0" y="0" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600">
        [LIVE REPOSITORIES: 20+ OPEN SOURCE] • [TOP SAAS VALIDATORS] • [UPDATED NOV 2026]
      </text>
    </g>
  </g>
</svg>
